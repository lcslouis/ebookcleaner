name: Auto Tag

# Runs on every push to main/master.
# Reads conventional commit messages to decide the version bump:
#   feat:            → minor  (0.1.0 → 0.2.0)
#   fix: / anything  → patch  (0.1.0 → 0.1.1)
#   feat!: or body contains BREAKING CHANGE: → major (0.1.0 → 1.0.0)
# Creates and pushes the new v* tag, which triggers build.yml.

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main,master
          tag_prefix: v

      - name: Summary
        run: |
          echo "Previous tag : ${{ steps.tag.outputs.previous_tag }}"
          echo "New tag      : ${{ steps.tag.outputs.new_tag }}"
          echo "Bump type    : ${{ steps.tag.outputs.release_type }}"
