name: Build Windows Executables

on:
  push:
    branches:
      - main
      - master
      - claude/ebook-management-app-27udad
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed so git describe works for dev builds

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $ver = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $ver = "dev-$("${{ github.sha }}".Substring(0,7))"
          }
          echo "VERSION=$ver" >> $env:GITHUB_ENV
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $ver"

      - name: Inject version into src/version.py
        shell: pwsh
        run: |
          $ver = $env:VERSION
          (Get-Content "src\version.py") `
            -replace '__version__ = "dev"', "__version__ = `"$ver`"" |
            Set-Content "src\version.py"
          Write-Host "src/version.py patched to $ver"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ------------------------------------------------------------------ EbookCleaner

      - name: Build EbookCleaner
        run: pyinstaller ebookcleaner.spec --clean --noconfirm

      - name: Verify EbookCleaner build
        shell: pwsh
        run: |
          if (Test-Path "dist\EbookCleaner\EbookCleaner.exe") {
            $size = (Get-Item "dist\EbookCleaner\EbookCleaner.exe").Length / 1MB
            Write-Host "EbookCleaner — EXE size: $([math]::Round($size,1)) MB"
          } else {
            Write-Host "ERROR: EbookCleaner.exe not found"
            exit 1
          }

      - name: ZIP EbookCleaner
        shell: pwsh
        run: |
          $zip = "dist\EbookCleaner-Windows-$env:VERSION.zip"
          Compress-Archive -Path dist\EbookCleaner -DestinationPath $zip
          $size = (Get-Item $zip).Length / 1MB
          Write-Host "ZIP: $zip  ($([math]::Round($size,1)) MB)"
          echo "CLEANER_ZIP=$zip" >> $env:GITHUB_ENV

      - name: Upload EbookCleaner artifact
        uses: actions/upload-artifact@v4
        with:
          name: EbookCleaner-Windows-${{ env.VERSION }}
          path: dist/EbookCleaner/
          retention-days: 90

      # ------------------------------------------------------------------ Provider Studio

      - name: Build Provider Studio
        run: pyinstaller provider_studio.spec --clean --noconfirm

      - name: Verify Provider Studio build
        shell: pwsh
        run: |
          if (Test-Path "dist\ProviderStudio\ProviderStudio.exe") {
            $size = (Get-Item "dist\ProviderStudio\ProviderStudio.exe").Length / 1MB
            Write-Host "ProviderStudio — EXE size: $([math]::Round($size,1)) MB"
          } else {
            Write-Host "ERROR: ProviderStudio.exe not found"
            exit 1
          }

      - name: ZIP Provider Studio
        shell: pwsh
        run: |
          $zip = "dist\ProviderStudio-Windows-$env:VERSION.zip"
          Compress-Archive -Path dist\ProviderStudio -DestinationPath $zip
          $size = (Get-Item $zip).Length / 1MB
          Write-Host "ZIP: $zip  ($([math]::Round($size,1)) MB)"
          echo "STUDIO_ZIP=$zip" >> $env:GITHUB_ENV

      - name: Upload Provider Studio artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProviderStudio-Windows-${{ env.VERSION }}
          path: dist/ProviderStudio/
          retention-days: 90

      # ------------------------------------------------------------------ Release (tags only)

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: EbookCleaner ${{ env.VERSION }}
          files: |
            ${{ env.CLEANER_ZIP }}
            ${{ env.STUDIO_ZIP }}
          generate_release_notes: true
          body: |
            ## EbookCleaner ${{ env.VERSION }}

            Two downloads available:

            | Download | Description |
            |----------|-------------|
            | `EbookCleaner-Windows-${{ env.VERSION }}.zip` | Main app — import, clean, rewrite, export ebooks |
            | `ProviderStudio-Windows-${{ env.VERSION }}.zip` | Provider Studio — create site plugins |

            ### Installing EbookCleaner
            1. Download and extract `EbookCleaner-Windows-${{ env.VERSION }}.zip`
            2. Run `EbookCleaner.exe` — no Python required
            3. Go to **Settings** to enter your AI API key
            4. Use **Plugins** in the toolbar to install community site parsers

            ### Installing Provider Studio
            1. Download and extract `ProviderStudio-Windows-${{ env.VERSION }}.zip`
            2. Run `ProviderStudio.exe`
            3. Fetch a site, define selectors, and submit to the plugin registry
