name: Build Windows Executables

on:
  push:
    branches:
      - main
      - master
      - claude/ebook-management-app-27udad
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $ver = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $ver = "dev-$("${{ github.sha }}".Substring(0,7))"
          }
          echo "VERSION=$ver" >> $env:GITHUB_ENV
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $ver"

      - name: Inject version into src/version.py
        shell: pwsh
        run: |
          $ver = $env:VERSION
          (Get-Content "src\version.py") `
            -replace '__version__ = "dev"', "__version__ = `"$ver`"" |
            Set-Content "src\version.py"
          Write-Host "src/version.py patched to $ver"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ------------------------------------------------------------------ 1. EbookCleaner (Full)

      - name: Build EbookCleaner (Full)
        run: pyinstaller ebookcleaner.spec --clean --noconfirm

      - name: Verify EbookCleaner (Full)
        shell: pwsh
        run: |
          if (Test-Path "dist\EbookCleaner\EbookCleaner.exe") {
            $size = (Get-Item "dist\EbookCleaner\EbookCleaner.exe").Length / 1MB
            Write-Host "EbookCleaner (Full) — $([math]::Round($size,1)) MB"
          } else { Write-Error "EbookCleaner.exe not found"; exit 1 }

      - name: ZIP EbookCleaner (Full)
        shell: pwsh
        run: |
          $zip = "dist\EbookCleaner-Windows-$env:VERSION.zip"
          Compress-Archive -Path dist\EbookCleaner -DestinationPath $zip
          echo "CLEANER_ZIP=$zip" >> $env:GITHUB_ENV

      - name: Upload EbookCleaner (Full) artifact
        uses: actions/upload-artifact@v4
        with:
          name: EbookCleaner-Windows-${{ env.VERSION }}
          path: dist/EbookCleaner/
          retention-days: 90

      # ------------------------------------------------------------------ 2. EbookCleaner Lite

      - name: Build EbookCleaner Lite
        run: pyinstaller ebookcleaner_lite.spec --clean --noconfirm

      - name: Rename Lite output folder
        shell: pwsh
        run: |
          Rename-Item "dist\EbookCleaner" "dist\EbookCleaner-Lite"

      - name: Verify EbookCleaner Lite
        shell: pwsh
        run: |
          if (Test-Path "dist\EbookCleaner-Lite\EbookCleaner.exe") {
            $size = (Get-Item "dist\EbookCleaner-Lite\EbookCleaner.exe").Length / 1MB
            Write-Host "EbookCleaner Lite — $([math]::Round($size,1)) MB"
          } else { Write-Error "EbookCleaner Lite EXE not found"; exit 1 }

      - name: ZIP EbookCleaner Lite
        shell: pwsh
        run: |
          $zip = "dist\EbookCleaner-Lite-Windows-$env:VERSION.zip"
          Compress-Archive -Path dist\EbookCleaner-Lite -DestinationPath $zip
          echo "LITE_ZIP=$zip" >> $env:GITHUB_ENV

      - name: Upload EbookCleaner Lite artifact
        uses: actions/upload-artifact@v4
        with:
          name: EbookCleaner-Lite-Windows-${{ env.VERSION }}
          path: dist/EbookCleaner-Lite/
          retention-days: 90

      # ------------------------------------------------------------------ 3. Provider Studio

      - name: Build Provider Studio
        run: pyinstaller provider_studio.spec --clean --noconfirm

      - name: Verify Provider Studio
        shell: pwsh
        run: |
          if (Test-Path "dist\ProviderStudio\ProviderStudio.exe") {
            $size = (Get-Item "dist\ProviderStudio\ProviderStudio.exe").Length / 1MB
            Write-Host "ProviderStudio — $([math]::Round($size,1)) MB"
          } else { Write-Error "ProviderStudio.exe not found"; exit 1 }

      - name: ZIP Provider Studio
        shell: pwsh
        run: |
          $zip = "dist\ProviderStudio-Windows-$env:VERSION.zip"
          Compress-Archive -Path dist\ProviderStudio -DestinationPath $zip
          echo "STUDIO_ZIP=$zip" >> $env:GITHUB_ENV

      - name: Upload Provider Studio artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProviderStudio-Windows-${{ env.VERSION }}
          path: dist/ProviderStudio/
          retention-days: 90

      # ------------------------------------------------------------------ 4. Full Bundle (Cleaner + Studio)

      - name: Build Full Bundle ZIP
        shell: pwsh
        run: |
          $bundle = "dist\EbookCleaner-Full-Bundle-Windows-$env:VERSION"
          New-Item -ItemType Directory -Path $bundle | Out-Null
          Copy-Item -Recurse "dist\EbookCleaner" "$bundle\EbookCleaner"
          Copy-Item -Recurse "dist\ProviderStudio" "$bundle\ProviderStudio"
          $zip = "$bundle.zip"
          Compress-Archive -Path $bundle -DestinationPath $zip
          $size = (Get-Item $zip).Length / 1MB
          Write-Host "Full Bundle — $([math]::Round($size,1)) MB"
          echo "BUNDLE_ZIP=$zip" >> $env:GITHUB_ENV

      - name: Upload Full Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: EbookCleaner-Full-Bundle-Windows-${{ env.VERSION }}
          path: dist/EbookCleaner-Full-Bundle-Windows-${{ env.VERSION }}/
          retention-days: 90

      # ------------------------------------------------------------------ Release (tags only)

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: EbookCleaner ${{ env.VERSION }}
          files: |
            ${{ env.BUNDLE_ZIP }}
            ${{ env.CLEANER_ZIP }}
            ${{ env.LITE_ZIP }}
            ${{ env.STUDIO_ZIP }}
          generate_release_notes: true
          body: |
            ## EbookCleaner ${{ env.VERSION }}

            ### Which download do I need?

            | Download | Size | AI features | Site login browser | Plugin creator |
            |----------|------|-------------|-------------------|----------------|
            | **Full Bundle** | Largest | ✓ | ✓ | ✓ |
            | **EbookCleaner** | Large | ✓ | ✓ | — |
            | **EbookCleaner Lite** | Small | — | — | — |
            | **Provider Studio** | Small | — | — | ✓ |

            - **Full Bundle** — EbookCleaner + Provider Studio in one ZIP. Best if you plan to create site plugins.
            - **EbookCleaner** — Main app with all features (AI cleaning/rewriting, site login browser).
            - **EbookCleaner Lite** — Fetch, clean with rules, and export. No AI, smaller download.
            - **Provider Studio** — Standalone tool for creating and submitting site plugins.

            ### Installation
            1. Download and extract your chosen ZIP
            2. Run `EbookCleaner.exe` or `ProviderStudio.exe` — no Python required
            3. Go to **Settings** to configure your AI API key (Full/Standard only)
            4. Use **Plugins** in the toolbar to browse the community plugin registry
